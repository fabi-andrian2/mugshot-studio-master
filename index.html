<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Éditeur de planches de comparaison de tailles à partir de sujets détourés." />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, Menlo, "Liberation Mono", monospace;
        --animate-fade-in: fade-in 140ms ease-out;
        --animate-pop-in: pop-in 140ms ease-out;
        @keyframes fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes pop-in {
          from { opacity: 0; transform: scale(0.97); }
          to { opacity: 1; transform: none; }
        }
      }
      @layer base {
        :where(button, select, summary, input[type="range"], input[type="color"], input[type="checkbox"]):focus-visible {
          outline: 2px solid rgb(52 211 153 / 0.8);
          outline-offset: 1px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <title>Mugshot Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
